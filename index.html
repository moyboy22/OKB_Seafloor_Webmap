
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKB | Seafloor Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081c2c;
      color: white;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
      padding: 16px 22px;
      background: rgba(8, 28, 44, 0.92);
      border-radius: 8px;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      font-size: 12px;
      color: #a9c2d2;
    }

    .coordinates {
      position: absolute;
      bottom: 25px;
      left: 16px;
      z-index: 2;
      padding: 10px 14px;
      background: rgba(8, 28, 44, 0.92);
      border-radius: 6px;
      font-size: 13px;
    }

    .attribution {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      padding: 4px 8px;
      background: rgba(8, 28, 44, 0.8);
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="header">
    <h1>OKB Seafloor Explorer</h1>
    <p>Southern Ocean Bathymetric Mapping</p>
  </div>

  <div class="coordinates" id="coordinates">
    Move cursor over map
  </div>

  <div class="attribution">
    Bathymetry: GEBCO Compilation Group (2026)
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          gebco: {
            type: "raster",
            tiles: [
              "https://wms.gebco.net/mapserv?" +
              "SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap" +
              "&LAYERS=GEBCO_LATEST&STYLES=" +
              "&FORMAT=image/png&TRANSPARENT=false" +
              "&SRS=EPSG:3857" +
              "&BBOX={bbox-epsg-3857}" +
              "&WIDTH=256&HEIGHT=256"
            ],
            tileSize: 256,
            attribution: "GEBCO Compilation Group"
          }
        },
        layers: [
          {
            id: "gebco-bathymetry",
            type: "raster",
            source: "gebco"
          }
        ]
      },
      center: [160, -55],
      zoom: 3,
      maxZoom: 14
    });

    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );

    map.addControl(
      new maplibregl.ScaleControl({
        maxWidth: 150,
        unit: "metric"
      }),
      "bottom-right"
    );

    map.on("mousemove", (event) => {
      const lng = event.lngLat.lng;
      const lat = event.lngLat.lat;

      document.getElementById("coordinates").textContent =
        `Latitude: ${lat.toFixed(5)}° | Longitude: ${lng.toFixed(5)}°`;
    });

    map.on("error", (event) => {
      console.error("Map error:", event.error);
    });
  </script>
</body>
</html>
